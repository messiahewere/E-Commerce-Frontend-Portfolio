<div class="container">
    <div class="product-container" *ngFor="let product of showProducts">
        <figure>
            <img [src]="product.images[0]" [alt]="product.title"/>
        </figure>
        <div class="text-container">
            <p><span class="item-title">Description:</span> {{product.description}}</p>
            <p><span class="item-title">Price:</span> {{product.price | currency}}</p>
            <p><span class="item-title">Category:</span> {{product.category}}</p>
            <p><span class="item-title">Brand:</span> {{product.brand}}</p>
            <p><span class="item-title">Rating:</span> {{product.rating}}</p>
        </div>
        <button>Add to Cart</button>
    </div>
</div>
