<div class="content-holder">
    <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item>
            <mat-icon>dialpad</mat-icon>
            <span>Redial</span>
        </button>
        <button mat-menu-item disabled>
            <mat-icon>voicemail</mat-icon>
            <span>Check voice mail</span>
        </button>
        <button mat-menu-item>
            <mat-icon>notifications_off</mat-icon>
            <span>Disable alerts</span>
        </button>
    </mat-menu>

    <figure routerLink="/home">
        <img src="EM.png">
    </figure>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text"  placeholder="Search products by name" #input>
        <button mat-icon-button matSuffix (click)="onSearchProductName(input.value)">
            <mat-icon>chevron_right</mat-icon>
        </button>
    </mat-form-field>
    <nav>
        <a routerLink="/orders" routerLinkActive="active">Orders</a>
        <a routerLink="/carts" routerLinkActive="active"><mat-icon [matBadge]="count" >shopping_cart</mat-icon>Carts</a>
    </nav>
</div>
